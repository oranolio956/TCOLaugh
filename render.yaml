services:
  # --- Web Service (FastAPI) ---
  - type: web
    name: panopticon-api
    env: python
    plan: standard
    buildCommand: |
      pip install -r requirements.txt
      python -m spacy download en_core_web_sm
    startCommand: uvicorn panopticon.api.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: PANOPTICON_API_KEY
        generateValue: true
      - key: PANOPTICON_ENABLE_AI_BRIEFING
        value: "false"
      - key: PANOPTICON_MAX_UPLOAD_BYTES
        value: "5242880"
      - key: ANTHROPIC_API_KEY
        sync: false # Prompt user on deploy
      - key: REDIS_URL
        fromService:
          type: redis
          name: panopticon-redis
          property: connectionString

  # --- Worker Service (Celery) ---
  - type: worker
    name: panopticon-worker
    env: python
    plan: standard
    buildCommand: |
      pip install -r requirements.txt
      python -m spacy download en_core_web_sm
    startCommand: celery -A panopticon.worker worker --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: REDIS_URL
        fromService:
          type: redis
          name: panopticon-redis
          property: connectionString

  # --- Background Worker (Crawler) ---
  - type: worker
    name: panopticon-crawler
    env: python
    plan: standard
    buildCommand: |
      pip install -r requirements.txt
      python -m spacy download en_core_web_sm
    startCommand: python3 -m panopticon.ingestion.tor.crawler
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0

  # --- Private Services (Databases) ---
  # Note: Render Native Redis
  - type: redis
    name: panopticon-redis
    plan: free
    ipAllowList: [] # Private only

  # Note: Render doesn't natively support Neo4j/Milvus as managed services.
  # We use a private docker service or external provider (AuraDB / Zilliz).
  # For this config, we assume an external connection string is provided or a Docker service.
  # Below is a Docker-based approach for a self-contained POC on Render (Plan: Pro required usually)
  # - type: pserv
  #   name: panopticon-neo4j
  #   env: docker
  #   plan: standard
  #   dockerfilePath: ./infrastructure/Dockerfile.neo4j # Custom wrapper if needed
