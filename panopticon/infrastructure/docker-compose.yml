version: '3.8'

services:
  # --- Ingestion Layer ---
  kafka:
    image: confluentinc/cp-kafka:latest
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  # --- Persistence Layer ---
  neo4j:
    image: neo4j:latest
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  opensearch:
    image: opensearchproject/opensearch:latest
    environment:
      - discovery.type=single-node
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  # Note: Vearch or Milvus would be configured here for Vector Search
  # For this scaffold, we represent the intent.

  # --- Application Services ---
  # api:
  #   build: ./api
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - neo4j
  #     - opensearch
  #     - kafka

volumes:
  neo4j_data:
  opensearch_data:
