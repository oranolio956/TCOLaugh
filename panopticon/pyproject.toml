[project]
name = "panopticon"
version = "0.1.0"
description = "Web-Scale Identity Resolution Platform"
authors = [
    {name = "Panopticon Architect", email = "architect@panopticon.local"},
]
dependencies = [
    "kafka-python>=2.0",
    "neo4j>=5.0",
    "opensearch-py>=2.0",
    "splink>=3.0",
    "insightface>=0.7",
    "mediapipe>=0.10",
    "fastapi>=0.95",
    "uvicorn>=0.22",
    "pydantic>=1.10",
    "numpy",
    "pandas"
]
requires-python = ">=3.9"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
