services:
  - type: web
    name: panopticon-api-847691
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: uvicorn panopticon.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.9"
      - key: PANOPTICON_API_KEY
        value: REPLACE_WITH_RENDER_SECRET
      - key: NEO4J_URI
        value: bolt://localhost:7687
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        value: REPLACE_WITH_RENDER_SECRET
      - key: REDIS_URL
        value: redis://localhost:6379
      - key: PANOPTICON_DB_PATH
        value: /data/panopticon.db
      - key: PANOPTICON_ENABLE_AI_BRIEFING
        value: "false"
      - key: PANOPTICON_MAX_UPLOAD_BYTES
        value: "5242880"
      - key: MILVUS_HOST
        value: localhost
      - key: MILVUS_PORT
        value: "19530"
      - key: PANOPTICON_USE_KAFKA
        value: "false"
    disk:
      name: panopticon-data
      mountPath: /data
      sizeGB: 1

  - type: worker
    name: panopticon-worker-847691
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: celery -A panopticon.worker worker --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: "3.9"
      - key: PANOPTICON_API_KEY
        value: REPLACE_WITH_RENDER_SECRET
      - key: NEO4J_URI
        value: bolt://localhost:7687
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        value: REPLACE_WITH_RENDER_SECRET
      - key: REDIS_URL
        value: redis://localhost:6379
      - key: PANOPTICON_DB_PATH
        value: /data/panopticon.db

  - type: worker
    name: panopticon-crawler-847691
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m panopticon.ingestion.crawlers.mock_crawler --continuous --delay 30
    envVars:
      - key: PYTHON_VERSION
        value: "3.9"
      - key: PANOPTICON_USE_KAFKA
        value: "false"
      - key: PANOPTICON_API_BASE_URL
        value: "https://your-render-api-url"
      - key: PANOPTICON_API_KEY
        value: REPLACE_WITH_RENDER_SECRET
